<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/app.css" />
    <title>Loja da Nike</title>
  </head>
  <body>
    <header>
      <div class="contacts">
        <span>
          <svg
            class="icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"
            />
          </svg>
          +244 931 419 656</span
        >
        <span>
          <svg
            class="icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"
            />
            <polyline points="22,6 12,13 2,6" />
          </svg>
          contacts@marcas.co.ao
        </span>
      </div>
      <div class="logo">
        <a href="#">
          <img src="./img/logo.png" alt="Marcas" />
        </a>
      </div>
      <nav>
        <ul>
          <li><a href="#" class="ative">HOME</a></li>
          <li><a href="#">CATOLOGOS</a></li>
          <li><a href="#">BLOG</a></li>
        </ul>
      </nav>
      <div class="form-user-actions">
        <div class="search">
          <input
            type="search"
            name="pesquisar"
            id="pesquisar"
            placeholder="Pesquisar..."
          />
          <button class="search-btn" aria-label="Pesquisar">
            <svg
              class="icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
          </button>
        </div>

        <ul>
          <li class="bag-sales">
            <a href="#" aria-label="carrinho" class="icon-btn">
              <svg
                class="icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z" />
                <line x1="3" y1="6" x2="21" y2="6" />
                <path d="M16 10a4 4 0 0 1-8 0" /></svg
            ></a>
          </li>
          <li class="user-profile">
            <a href="#" aria-label="user" class="icon-btn" 
              ><svg
                class="icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" /></svg
            ></a>
          </li>
        </ul>
      </div>
    </header>
    <main>
      <section >
         
        <article class="product-img">
        <img src="./img/tenis.png" alt="Ténis" />
      </article>
      
      <article class="description">
        <h2>Verão</h2>
        <h1>Nike Brasilia 9.5</h1>
        <span>Training Duffel Bag (Large, 95L)</span>
        <br />
        <span>1 Color</span>
        <h2><b>$56</b></h2>
        <button type="submit">COMPRAR AGORA</button>
        </article>
      </section>
       
    </main>
    <hr />
    <footer>
      <div class="nav-footer">
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="#">Catalogos</a></li>
          <li><a href="#">blog</a></li>
        </ul>
      </div>
      <div class="copy">&copy;Todos os direitos reservados</div>
    </footer>
  </body>
</html>
